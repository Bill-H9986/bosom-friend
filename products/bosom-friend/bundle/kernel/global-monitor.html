<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bosom Friend 全局监控面板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f12;
            color: #e8e8f0;
            padding: 20px;
            line-height: 1.6;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2a2a35;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #1a1a24;
            border-radius: 20px;
            font-size: 13px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .card {
            background: #1a1a24;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2a35;
        }
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 14px;
            color: #8b8ba3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        .card-subtitle {
            font-size: 12px;
            color: #6b6b80;
            margin-top: 4px;
        }
        .section {
            background: #1a1a24;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2a35;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }
        .account-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #14141a;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .account-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .account-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }
        .account-name {
            font-weight: 500;
        }
        .account-platform {
            font-size: 12px;
            color: #6b6b80;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .badge-success {
            background: rgba(74, 222, 128, 0.15);
            color: #4ade80;
        }
        .badge-warning {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }
        .badge-info {
            background: rgba(96, 165, 250, 0.15);
            color: #60a5fa;
        }
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b6b80;
        }
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }
        .timeline {
            position: relative;
            padding-left: 20px;
        }
        .timeline::before {
            content: '';
            position: absolute;
            left: 6px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #2a2a35;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 16px;
        }
        .timeline-item::before {
            content: '';
            position: absolute;
            left: -14px;
            top: 6px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #667eea;
            border: 2px solid #1a1a24;
        }
        .timeline-time {
            font-size: 12px;
            color: #6b6b80;
            margin-bottom: 4px;
        }
        .timeline-content {
            font-size: 14px;
        }
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .refresh-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌐 Bosom Friend 全局监控</h1>
        <div class="status-badge">
            <div class="status-dot"></div>
            <span>系统正常运行中</span>
        </div>
    </div>

    <div class="dashboard">
        <div class="card">
            <div class="card-header">
                <span class="card-title">平台账号</span>
                <span class="badge badge-success">已登录</span>
            </div>
            <div class="card-value">1</div>
            <div class="card-subtitle">抖音 · 1个平台</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">素材库</span>
                <span class="badge badge-info">充足</span>
            </div>
            <div class="card-value">4</div>
            <div class="card-subtitle">图片/视频素材</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">待接待</span>
                <span class="badge badge-success">无任务</span>
            </div>
            <div class="card-value">0</div>
            <div class="card-subtitle">评论/私信待回复</div>
        </div>

        <div class="card">
            <div class="card-header">
                <span class="card-title">发布记录</span>
                <span class="badge badge-warning">暂无</span>
            </div>
            <div class="card-value">0</div>
            <div class="card-subtitle">累计发布内容数</div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">平台账号状态</div>
        <div class="account-item">
            <div class="account-info">
                <div class="account-avatar">抖</div>
                <div>
                    <div class="account-name">抖音账号</div>
                    <div class="account-platform">douyin.com</div>
                </div>
            </div>
            <span class="badge badge-success">已登录</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">系统运行状态</div>
        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-time">2026-09-21 12:38</div>
                <div class="timeline-content">系统健康检查通过 · 内核运行正常</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-time">2026-09-21 12:38</div>
                <div class="timeline-content">数据中心初始化完成 · 账号/素材/记录已同步</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-time">2026-09-21 12:38</div>
                <div class="timeline-content">所有系统服务运行正常</div>
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">快捷操作</div>
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
            <button class="refresh-btn" onclick="location.reload()">刷新监控数据</button>
        </div>
    </div>
</body>
</html>
